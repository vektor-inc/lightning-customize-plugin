# Dependabot の PR に対して、依存関係のインストールとビルドが通るかを確認する軽量な CI。
# dependabot-auto-merge-complete.yml がこのワークフローの成功を見てマージする。
#
# PHPUnit（wp-env で WordPress を起動するため実行時間が長い）はこのリポジトリでは
# ワークフロー化されておらず、ここでも実行しない。人が作った PR ではこのワークフローは動かない。
name: Dependabot CI

on:
  pull_request:
    branches:
      - master
    # labeled を含めない。Dependabot は PR 作成直後に dependencies などのラベルを
    # 次々に付けるため、含めるとそのたびに起動して同じ内容を何度もビルドする。
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install npm packages
        run: npm ci

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist

      # このリポジトリには npm run build が無く、CSS のビルド（sass → autoprefixer / minify → 中間 CSS の削除）
      # を行う build:css だけがあるため、それを実行する。wp-env は起動しない。
      - name: Build CSS
        run: npm run build:css
